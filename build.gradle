plugins {
    id 'java'
    id "com.github.johnrengelman.shadow" version "7.1.2"
}

group = 'com.github.getplusm'
version = '5.0.0'

allprojects {
    apply plugin: 'java'
    apply plugin: 'com.github.johnrengelman.shadow'

    compileJava.options.encoding = "UTF-8"
    compileTestJava.options.encoding = "UTF-8"
    java.sourceCompatibility = JavaVersion.VERSION_17

    repositories {
        mavenLocal()
        mavenCentral()

        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "sonatype"
            url = "https://oss.sonatype.org/content/groups/public/"
        }

        // Holographic Displays
        maven { url = 'https://repo.codemc.io/repository/maven-public/' }
        maven { url = 'https://repo.fancyplugins.de/releases' }
        //WorldGuard API
        maven { url = 'https://maven.enginehub.org/repo/' }
        // PAPI
        maven { url = 'https://repo.extendedclip.com/content/repositories/placeholderapi/' }

        maven { url = 'https://jitpack.io' }
        maven { url = 'https://libraries.minecraft.net/' }
        maven { url = 'https://nexus.phoenixdevt.fr/repository/maven-public/' }

        // griefdefender
        maven { url = 'https://repo.glaremasters.me/repository/bloodshot' }

        // PaF
        maven { url = 'https://simonsator.de/repo/' }

        // Parties
        maven { url 'https://repo.alessiodp.com/releases/' }

        // towny
        maven { url = 'https://repo.glaremasters.me/repository/towny/' }

        // ProSkillAPI
        maven { url = 'https://s01.oss.sonatype.org/content/repositories/snapshots' }

    }

    dependencies {
        compileOnly 'io.papermc.paper:paper-api:1.20.2-R0.1-SNAPSHOT'

        compileOnly 'me.clip:placeholderapi:2.11.5'
        compileOnly 'net.luckperms:api:5.4'

        // Libs
        compileOnly 'com.github.ben-manes.caffeine:caffeine:3.1.6'
        compileOnly 'com.github.caseyscarborough:pastebin-api-java:0.1.3'
        compileOnly 'com.cjcrafter:foliascheduler:0.6.3'

        compileOnly 'net.kyori:adventure-text-minimessage:4.14.0'
        compileOnly 'com.github.ben-manes.caffeine:caffeine:3.1.6'
        compileOnly 'org.spongepowered:configurate-yaml:4.1.2'
        compileOnly 'org.spongepowered:configurate-core:4.1.2'
        compileOnly 'cloud.commandframework:cloud-core:1.8.4'
        compileOnly 'cloud.commandframework:cloud-paper:1.8.4'
        compileOnly 'cloud.commandframework:cloud-minecraft-extras:1.8.4'

        compileOnly 'org.jetbrains:annotations:24.1.0'
        compileOnly 'org.projectlombok:lombok:1.18.32'
        annotationProcessor 'org.projectlombok:lombok:1.18.32'
    }
}

dependencies {
    shadow project(path: ":paper", configuration: "default")
}